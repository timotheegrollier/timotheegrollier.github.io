<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <g transform="translate(400, 210)">
    <!-- PC -->
    <rect x="-140" y="-40" width="60" height="45" rx="5" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="-135" y="-35" width="50" height="30" fill="#0EA5E9" fill-opacity="0.2"/>
    <path d="-120 10 L-100 10 L-105 18 L-115 18 Z" fill="#64748B"/>
    <line x1="-125" y1="18" x2="-95" y2="18" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Wi-Fi Sound waves -->
    <path d="M-60 -25 A 35 35 0 0 1 -60 15" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-45 -15 A 20 20 0 0 1 -45 5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Raspberry Pi -->
    <rect x="-25" y="-30" width="50" height="40" rx="6" fill="#047857" stroke="#10B981" stroke-width="2"/>
    <circle cx="-10" cy="-10" r="4" fill="#E11D48"/>
    <circle cx="5" cy="-10" r="4" fill="#E11D48"/>
    <circle cx="-10" cy="5" r="4" fill="#E11D48"/>
    <circle cx="5" cy="5" r="4" fill="#E11D48"/>
    <rect x="15" y="-20" width="8" height="20" fill="#94A3B8"/>

    <!-- Wire to Speaker -->
    <path d="M25 -10 L60 -10 L75 -20" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- KRK Monitor Speaker -->
    <rect x="80" y="-55" width="60" height="85" rx="6" fill="#18181B" stroke="#27272A" stroke-width="2"/>
    <!-- Yellow cone -->
    <circle cx="110" cy="-5" r="18" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <circle cx="110" cy="-5" r="6" fill="#18181B"/>
    <!-- Tweeter -->
    <circle cx="110" cy="-35" r="7" fill="#27272A" stroke="#52525B" stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="white" font-weight="700" letter-spacing="-0.02em">FEDORA WIFI SOUND LINK</text>
  <text x="400" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94A3B8" font-weight="500">PC → Raspberry Pi → KRK Studio Audio (Roc FEC + PipeWire)</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#022C22"/>
      <stop offset="0.5" stop-color="#064E3B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
</svg>
