<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <g transform="translate(400, 215)">
    <!-- Globe network -->
    <circle cx="0" cy="0" r="75" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3" fill="none"/>
    <ellipse cx="0" cy="0" rx="75" ry="32" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
    <ellipse cx="0" cy="0" rx="32" ry="75" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
    
    <!-- Peer node left -->
    <circle cx="-110" cy="0" r="18" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <path d="M-116 -4 L-110 3 L-104 -4" stroke="white" stroke-width="2" fill="none"/>
    
    <!-- Peer node right -->
    <circle cx="110" cy="0" r="18" fill="#0D9488" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M104 4 L110 -3 L116 4" stroke="white" stroke-width="2" fill="none"/>
    
    <!-- WebRTC connection beam -->
    <path d="M-92 0 L92 0" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6"/>
    
    <!-- Center Lock / Direct P2P badge -->
    <circle cx="0" cy="0" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <rect x="-7" y="-3" width="14" height="11" rx="2" fill="#38BDF8"/>
    <path d="M-4 -3 V-6 A 4 4 0 0 1 4 -6 V-3" stroke="#38BDF8" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="white" font-weight="700" letter-spacing="-0.02em">GLOBAL SHARE</text>
  <text x="400" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94A3B8" font-weight="500">Instant Encrypted P2P WebRTC File Sharing PWA</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#042F2E"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
</svg>
